<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oracle Dial preview card</title>
<!-- Source for /og.png (1200 × 630). See "Preview image" in the README to regenerate. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@500&family=STIX+Two+Text:ital,wght@1,400&display=block">
<style>
  :root {
    --paper: #0f1012;
    --ink: #e7e8eb;
    --ink-2: #a6aab3;
    --ink-3: #6d727c;
    --rule: #2a2c31;
    --accent: #98abe0;
    --oracle: #f0a24c;
    --pool: #84a0ff;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
  body { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card {
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    padding: 56px 72px 60px;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
  }
  .top {
    display: flex;
    justify-content: space-between;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .eq {
    font-family: "STIX Two Text", "Times New Roman", serif;
    font-style: italic;
    font-size: 124px;
    line-height: 1;
    letter-spacing: -0.01em;
    margin-top: 40px;
  }
  .eq .l { color: var(--accent); }
  .eq .up { font-style: normal; }
  canvas { width: 1056px; height: 150px; align-self: center; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .name { font-weight: 600; font-size: 58px; letter-spacing: -0.03em; line-height: 1; }
  .sub { font-size: 25px; color: var(--ink-2); margin-top: 12px; }
  .key { display: flex; gap: 24px; font-size: 19px; color: var(--ink-2); padding-bottom: 4px; }
  .key i { display: inline-block; width: 24px; border-top: 3px solid; vertical-align: middle; margin-right: 9px; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span>arXiv:2609.33799 · Amini &amp; Feinstein</span><span>op-amm.vercel.app</span></div>
  <div class="eq">p <span class="up">=</span> <span class="l">λ</span>π <span class="up">+ (1 −</span> <span class="l">λ</span><span class="up">)</span> π<sup class="up">*</sup></div>
  <canvas id="c" width="2112" height="300"></canvas>
  <div class="foot">
    <div>
      <div class="name">Oracle Dial</div>
      <div class="sub">An interactive companion to the OP-AMM paper</div>
    </div>
    <div class="key">
      <span><i style="border-color: var(--ink)"></i>market</span>
      <span><i style="border-color: var(--oracle)"></i>oracle</span>
      <span><i style="border-color: var(--pool)"></i>pool</span>
    </div>
  </div>
</div>
<script src="../engine.js"></script>
<script>
  // The live panel's opening day: an L2 oracle and a λ = 0.6 pool with a 5 bps fee.
  function draw() {
    const day = OD.makeDay(20230103 + 7919);
    const orc = OD.oraclePath(day, OD.REGIMES.l2);
    const pool = new OD.Pool(0.6, 5e-4);
    const T = 3000, q = new Float64Array(T + 1);
    for (let t = 1; t <= T; t++) { pool.step(day.s[t], orc.pi[t]); q[t] = pool.quote; }
    let lo = Infinity, hi = -Infinity;
    for (let t = 1; t <= T; t++) for (const v of [day.s[t], orc.pi[t], q[t]]) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    const css = getComputedStyle(document.documentElement);
    const col = (n) => css.getPropertyValue(n).trim();
    const ctx = document.getElementById("c").getContext("2d");
    ctx.scale(2, 2);
    const W = 1056, H = 150, pad = 8;
    const x = (t) => (t / T) * W;
    const y = (v) => pad + (1 - (v - lo) / (hi - lo)) * (H - 2 * pad);
    ctx.strokeStyle = col("--rule");
    ctx.lineWidth = 1;
    for (const f of [0, 0.5, 1]) {
      ctx.beginPath(); ctx.moveTo(0, pad + f * (H - 2 * pad)); ctx.lineTo(W, pad + f * (H - 2 * pad)); ctx.stroke();
    }
    const line = (get, color, width) => {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = "round";
      ctx.beginPath();
      for (let t = 1; t <= T; t++) t === 1 ? ctx.moveTo(x(t), y(get(t))) : ctx.lineTo(x(t), y(get(t)));
      ctx.stroke();
    };
    line((t) => day.s[t], col("--ink"), 1.4);
    line((t) => q[t], col("--pool"), 2.2);
    line((t) => orc.pi[t], col("--oracle"), 2.6);
  }
  document.fonts.ready.then(() => { draw(); document.body.dataset.ready = "1"; });
</script>
</body>
</html>
